# AI Hub — LiteLLM Proxy configuration
# Real provider API keys come from environment variables (never from client projects).
# Client projects only use Virtual Keys created via the Admin API / bootstrap script.

model_list:
  # --- Primary: Gemini ---
  - model_name: gemini/gemini-2.0-flash
    litellm_params:
      model: gemini/gemini-2.0-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini/gemini-1.5-flash
    litellm_params:
      model: gemini/gemini-1.5-flash
      api_key: os.environ/GEMINI_API_KEY

  # --- Fallback / alternate providers ---
  - model_name: openai/gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: deepseek/deepseek-chat
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY
      api_base: https://api.deepseek.com

  - model_name: groq/llama-3.3-70b-versatile
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY

  # --- Embeddings (used by RAG Service via LiteLLM) ---
  - model_name: text-embedding-3-small
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY

  - model_name: text-embedding-004
    litellm_params:
      model: gemini/text-embedding-004
      api_key: os.environ/GEMINI_API_KEY

  # --- Aliases used by projects ---
  - model_name: chat-default
    litellm_params:
      model: gemini/gemini-2.0-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: embedding-default
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY

litellm_settings:
  drop_params: true
  set_verbose: false
  request_timeout: 60
  num_retries: 2
  # Automatic fallback when primary model fails
  fallbacks:
    - gemini/gemini-2.0-flash: [openai/gpt-4o-mini, deepseek/deepseek-chat, groq/llama-3.3-70b-versatile]
    - chat-default: [openai/gpt-4o-mini, deepseek/deepseek-chat]
    - openai/gpt-4o-mini: [gemini/gemini-2.0-flash, deepseek/deepseek-chat]
  context_window_fallbacks:
    - gemini/gemini-2.0-flash: [openai/gpt-4o-mini]
  # Cooldown a failing deployment before retrying
  allowed_fails: 3
  cooldown_time: 60

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  # Disable UI auth bypass in production — master key required
  ui_access_mode: admin_only

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 60
  retry_after: 5
