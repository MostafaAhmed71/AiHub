name: rag-service-tests

on:
  push:
    paths:
      - "rag-service/**"
      - ".github/workflows/rag-service-tests.yml"
  pull_request:
    paths:
      - "rag-service/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
